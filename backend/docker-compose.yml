version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kai-flow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: kafeinflow
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - kai-flow-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kai-flow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/kafeinflow?authSource=admin
      MAX_PORT_TRIES: 10
    depends_on:
      - mongodb
    networks:
      - kai-flow-network
    volumes:
      - ./src:/app/src
      - ./server.js:/app/server.js

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  kai-flow-network:
    driver: bridge
